# Apply once: kubectl apply -n argocd -f bootstrap/root.yaml
# After that, Argo CD manages everything under argocd/ from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cu-devclub/CUGrader-infrastructure
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
