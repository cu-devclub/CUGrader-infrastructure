# Production: same as envs-auto but manual sync (click Sync in Argo CD after the tag bump is merged).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: envs-production
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/cu-devclub/CUGrader-infrastructure
        revision: main
        directories:
          - path: apps/*/overlays/production
  template:
    metadata:
      name: '{{index .path.segments 1}}-production'
      labels:
        env: production
    spec:
      project: cugrader
      source:
        repoURL: https://github.com/cu-devclub/CUGrader-infrastructure
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: cugrader-production
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
